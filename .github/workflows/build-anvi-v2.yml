name: Build Anvi AI

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Anvi project
        run: |
          rm -rf AnviAI_Full_Native
          unzip -q AnviAI_Full_Native.zip -d AnviAI_Full_Native
          test -f AnviAI_Full_Native/settings.gradle.kts

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q gradle-8.9-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Enable AndroidX
        run: |
          echo "android.useAndroidX=true" >> AnviAI_Full_Native/gradle.properties
          echo "android.enableJetifier=true" >> AnviAI_Full_Native/gradle.properties

      - name: Build APK
        working-directory: AnviAI_Full_Native
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Anvi-AI-debug
          path: AnviAI_Full_Native/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
